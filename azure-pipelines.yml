# Pipeline del back: prueba, empaqueta y es el UNICO que despliega a Azure.
# Se dispara por un commit al back o cuando el pipeline "Oklahoma Front"
# termina bien (asi cada cambio de front tambien llega a produccion).
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  pipelines:
    - pipeline: front
      source: 'Oklahoma Front'
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Conexion de servicio creada en Project Settings > Service connections.
  azureSubscription: 'oklahoma-azure-connection'
  webAppName: 'oklahoma-rg'

stages:
  - stage: Test
    displayName: 'Pruebas del back'
    jobs:
      - job: Test
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Instalar Node.js'

          - script: npm ci
            displayName: 'Instalar dependencias'

          # Mismas compuertas que Husky, pero que no se pueden saltar con --no-verify.
          - script: npm run format:check
            displayName: 'Formato (Prettier)'

          - script: npm run lint
            displayName: 'Lint (malas practicas)'

          - script: npm test
            displayName: 'Ejecutar tests'

  - stage: Package
    displayName: 'Empaquetar back + front'
    dependsOn: Test
    jobs:
      - job: Package
        steps:
          - download: front
            artifact: front-dist
            displayName: 'Descargar build del front'

          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Instalar Node.js'

          - script: npm ci --omit=dev
            displayName: 'Instalar dependencias de produccion'

          - script: |
              set -e
              out="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$out"
              rsync -a --exclude '.git' --exclude 'test' --exclude 'azure-pipelines.yml' ./ "$out/"
              mkdir -p "$out/public"
              cp -r "$(Pipeline.Workspace)/front/front-dist/." "$out/public/"
            displayName: 'Armar paquete (back + front en /public)'

          - publish: '$(Build.ArtifactStagingDirectory)/app'
            artifact: app
            displayName: 'Publicar paquete'

  - stage: Deploy
    displayName: 'Desplegar a Azure'
    dependsOn: Package
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployToAzure
        environment: 'produccion-azure'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/app'
                  displayName: 'Desplegar a Azure App Service'

                - script: |
                    for i in 1 2 3 4 5 6; do
                      code=$(curl -s -o /dev/null -w '%{http_code}' https://oklahoma-rg-bdbbdmcfb0bsfgay.brazilsouth-01.azurewebsites.net/api/health || true)
                      echo "Intento $i: HTTP $code"
                      [ "$code" = "200" ] && exit 0
                      sleep 20
                    done
                    echo "El despliegue no responde en /api/health"; exit 1
                  displayName: 'Verificar que la app responde'
